<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>皮肤库 · VALO ARCHIVE</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg?v=4" sizes="any" />
<link rel="stylesheet" href="/static/style.css?v=dad8d6009b" />
<link rel="stylesheet" href="/static/tools.css?v=2a245b1dd8" />
<style>
  /* 顶部全局搜索：不挑枪，直接搜皮肤名 */
  .skin-search { margin-bottom: 18px; padding: 14px; }
  .search-wrap { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line-strong);
    border-radius: 10px; background: var(--paper); padding: 0 12px; height: 42px; }
  .search-wrap svg { flex: 0 0 auto; color: var(--muted); }
  .search-wrap input { flex: 1 1 auto; min-width: 0; border: 0; background: transparent; font: inherit;
    font-size: 14px; color: var(--ink); outline: none; height: 100%; }
  .search-wrap .clr { border: 0; background: transparent; color: var(--muted); cursor: pointer;
    font-size: 16px; line-height: 1; padding: 4px; border-radius: 6px; }
  .search-wrap .clr:hover { background: var(--paper-2); color: var(--ink); }
  .search-wrap:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

  .skin-layout { display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 18px; align-items: start; }
  @media (max-width: 860px) { .skin-layout { grid-template-columns: 1fr; } }

  .skin-side { position: sticky; top: 16px; padding: 12px; }
  .wlist { display: flex; flex-direction: column; gap: 2px; max-height: min(70vh, 560px); overflow: auto; }
  @media (max-width: 860px) {
    .skin-side { position: static; }
    .wlist { flex-direction: row; gap: 6px; max-height: none; overflow-x: auto; padding-bottom: 4px; }
    .wlist button { flex: 0 0 auto; }
  }
  .wlist button { display: flex; align-items: center; gap: 8px; border: 1px solid transparent; background: transparent;
    border-radius: 9px; padding: 7px 9px; font: inherit; font-size: 13px; color: var(--ink-2); cursor: pointer;
    text-align: left; width: 100%; }
  .wlist button:hover { background: var(--paper-2); }
  .wlist button.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .wlist img { width: 44px; height: 20px; object-fit: contain; filter: drop-shadow(0 1px 1px rgba(0,0,0,.18)); }
  .wlist .n { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .wlist .c { font: 11px/1 var(--mono); color: var(--muted); }

  .skin-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px;
    flex-wrap: wrap; margin: 0 0 12px; }
  .skin-toolbar .panel-title { margin: 0; letter-spacing: .04em; }
  .skin-grid { grid-template-columns: repeat(auto-fill, minmax(214px, 1fr)); }
  .skin-card { cursor: pointer; }
  /* 皮肤名只要一行：宁可缩字号也不用「…」、也不折行 */
  .skin-card .card-name { white-space: nowrap; overflow: visible; text-overflow: clip; }
  .skin-card .art { height: 104px; display: grid; place-items: center; border-radius: 9px;
    background: linear-gradient(180deg, var(--paper-2), var(--paper)); border: 1px solid var(--line); }
  .skin-card .art img { max-width: 92%; max-height: 84px; object-fit: contain; }
  .skin-card .row { display: flex; align-items: center; gap: 6px; justify-content: space-between; flex-wrap: wrap; }

  /* 品质（Select/豪华/卓越/…）小标签，底色取官方 highlightColor */
  .tier-chip { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; line-height: 1;
    padding: 4px 8px; border-radius: 999px; border: 1px solid var(--line-strong); color: var(--ink-2); white-space: nowrap; }
  .tier-chip i { width: 7px; height: 7px; border-radius: 50%; background: var(--tier, var(--accent)); display: inline-block; }

  /* 皮肤详情 */
  .skin-modal { width: min(880px, 100%); }
  .skin-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
    flex-wrap: wrap; padding-right: 34px; }
  .skin-head h2 { margin: 0 0 5px; font-size: 21px; }
  .skin-stage { position: relative; margin-top: 14px; border-radius: 12px; overflow: hidden;
    background: radial-gradient(120% 90% at 50% 0%, #fff 0%, #f4f8f7 55%, #edf3f2 100%);
    box-shadow: inset 0 0 0 1px rgba(20, 101, 79, .08);
    min-height: 210px; display: grid; place-items: center; }
  .skin-stage video, .skin-stage img { display: block; width: 100%; max-height: 420px; object-fit: contain; }
  .skin-stage img { padding: 12px; box-sizing: border-box; }
  .skin-tip { margin-top: 8px; font-size: 12px; color: var(--muted); }
  .skin-tabs { margin-top: 14px; }
  .skin-tiles { margin-top: 12px; display: grid; gap: 10px;
    grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); }
  .tile { border: 1px solid var(--line); background: var(--paper); border-radius: 10px; padding: 8px;
    cursor: pointer; text-align: center; font: inherit; color: var(--ink-2); }
  .tile:hover { border-color: var(--accent); }
  .tile.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-ink); }
  .tile img { display: block; width: 100%; height: 52px; object-fit: contain; margin-bottom: 6px; }
  .tile .lb { font-size: 11px; line-height: 1.35; white-space: nowrap; overflow: visible; text-overflow: clip; }
  /* tools.css 里 .skin-tiles .tile .lb 带省略号，特异性比上面高，这里必须同权重覆盖 */
  .skin-tiles .tile .lb { white-space: nowrap; overflow: visible; text-overflow: clip; }
  .tile .sw { width: 16px; height: 16px; border-radius: 5px; margin: 0 auto 5px; border: 1px solid var(--line-strong); }

  /* 手机/平板：武器条改成真正「一行三把枪」的小胶囊。
     之前 .wlist 转成横排后，按钮仍带着 width:100%，每个都被撑成一屏宽，
     左边图标+名字、右边一大片空白，看着像只能点一个。 */
  @media (max-width: 860px) {
    .wlist {
      flex-direction: row; gap: 6px; max-height: none;
      overflow-x: auto; overflow-y: hidden; padding: 2px 2px 4px;
      scrollbar-width: none; -ms-overflow-style: none;
    }
    .wlist::-webkit-scrollbar { display: none; height: 0; }
    .wlist button {
      flex: 0 0 auto; width: auto; max-width: 168px;
      gap: 6px; padding: 6px 10px 6px 7px; border-radius: 999px;
      border-color: var(--line); background: var(--paper);
    }
    .wlist button.on { border-color: var(--accent); }
    .wlist img { width: 34px; height: 16px; }
    .wlist[data-hscroll] { padding-bottom: 14px; }
    .wlist .n { flex: 0 1 auto; max-width: 92px; }
    .wlist .c { flex: none; }
  }
</style>
</head>
<body>
<div class="grid-bg" aria-hidden="true"></div>
<div class="tool-page">
  <nav class="tool-nav">
    <a href="/">← 回首页</a>
    <a href="/crosshairs">准星库</a>
    <a href="/lineups">点位库</a>
    <a href="/catalog/agents">英雄库</a>
    <a href="/catalog/skins" class="on">皮肤库</a>
    <a href="/catalog/cosmetics">个性库</a>
    <a href="/status">状态</a>
  </nav>
  <div class="tool-head">
    <div>
      <h1>皮肤库</h1>
      <div class="sub">全部武器皮肤：逐级看模型、逐色看炫彩，能看的地方都带官方实战演示视频。</div>
    </div>
    <div class="tool-actions"><a class="btn small" href="/crosshairs">准星库</a><a class="btn small" href="/lineups">点位库</a><a class="btn small" href="/catalog/agents">英雄库</a><a class="btn small" href="/catalog/cosmetics">个性库</a><a class="btn small" href="/">回首页</a></div>
  </div>

  <div class="card-panel skin-search">
    <div class="search-wrap">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.6-3.6"></path></svg>
      <input id="gq" type="search" autocomplete="off" placeholder="搜全部皮肤：盖亚 / 破坏者 / 电音光谱…（不用先选枪）" />
      <button class="clr" id="gq-x" type="button" aria-label="清空" hidden>✕</button>
    </div>
    <div class="hint" id="gq-hint" style="margin-top:8px">也可以点左边挑一把枪，只看这把枪的皮肤。</div>
  </div>

  <div class="skin-layout">
    <aside class="card-panel skin-side">
      <div class="panel-title">武器</div>
      <div class="wlist" id="wlist" data-hscroll></div>
    </aside>
    <section>
      <div class="skin-toolbar">
        <div class="panel-title" id="sk-title">皮肤</div>
        <div class="skin-sorts">
          <div class="seg" id="sort">
            <button type="button" data-sort="tier" class="on">品质</button>
            <button type="button" data-sort="name">名称</button>
          </div>
          <button class="btn small" id="sort-dir" type="button" title="切换排序方向">↓ 高到低</button>
        </div>
      </div>
      <div class="chips" id="tier-filter" style="margin-bottom:12px"></div>
      <div class="cards skin-grid" id="skins"></div>
      <div class="empty" id="empty" style="display:none">没有匹配的皮肤。</div>
    </section>
  </div>

  <div class="legal">非官方工具，与 Riot Games / 腾讯无关；皮肤数据（含演示视频）来自 Riot 公开的官方素材，仅供参考。</div>
</div>

<div class="modal" id="modal"><div class="modal-card skin-modal">
  <button class="modal-x" id="modal-x" type="button" aria-label="关闭">✕</button>
  <div id="skin-body"></div>
</div></div>

<script src="/static/config.js?v=4822873cf0"></script>
<script>
(function () {
  const $ = (s) => document.querySelector(s);
  const A = (u) => (window.valoAsset ? window.valoAsset(u) : u);
  const esc = (t) => String(t || "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  const state = { weapons: [], weapon: "", weaponName: "", skins: [], tier: "", q: "", sort: "tier", desc: true };
  const MAX_ROWS = 240;

  // 图片/视频都直连官方 CDN（本站只出接口，不搬媒体流量）；直连失败才回落到 /img。
  window.__fb = function (img) {
    if (!img || img.dataset.fb) return;
    const src = img.currentSrc || img.src || "";
    if (!/^https?:/i.test(src)) return;
    img.dataset.fb = "1";
    img.src = A("/img?url=" + encodeURIComponent(src));
  };

  function sortList(list) {
    const byName = (a, b) => String(a.name || "").localeCompare(String(b.name || ""), "zh-Hans-CN");
    const key = state.sort;
    const out = list.slice().sort((a, b) => {
      if (key === "name") return byName(a, b);
      const t = (b.tier_rank || 0) - (a.tier_rank || 0);
      return t || byName(a, b);
    });
    if (key === "name") return state.desc ? out.reverse() : out;
    return state.desc ? out : out.reverse();
  }

  // ── 左侧武器列表 ─────────────────────────────────────────────
  function renderWeapons() {
    const box = $("#wlist");
    box.innerHTML = "";
    state.weapons.forEach((w) => {
      const b = document.createElement("button");
      b.type = "button";
      b.dataset.uuid = w.uuid;
      b.innerHTML = `<img src="${A(w.icon)}" alt="" loading="lazy" onerror="__fb(this)"><span class="n">${esc(w.name)}</span><span class="c">${w.skin_count || 0}</span>`;
      if (w.uuid === state.weapon) b.classList.add("on");
      b.addEventListener("click", () => pickWeapon(w));
      box.appendChild(b);
    });
  }

  function tierChip(name, color) {
    if (!name) return "";
    return `<span class="tier-chip" style="--tier:${esc(color || "transparent")}"><i></i>${esc(name)}</span>`;
  }

  // ── 价格 ────────────────────────────────────────────────────
  // 掌瓦有真实价 → 直接标；战令 / 活动 / 只能整包买的 → 明说没有单独售价，别瞎估。
  // 只有「有品质档、但掌瓦搜索里确实没有」的少数几款才给参考价，并且标明是参考。
  function priceChip(s) {
    const kind = s.price_kind || (s.price ? "estimate" : "");
    const num = Number(s.price || 0);
    if (kind === "store" && num > 0) {
      return `<span class="price" title="国服点券价（掌瓦商城）">${num.toLocaleString("zh-CN")} 点券</span>`;
    }
    if (kind === "free") {
      return `<span class="price free" title="战令 / 活动皮，本身没有单独售价">无单独售价</span>`;
    }
    if (num > 0) {
      const why = s.price_unknown
        ? "掌瓦搜索里查不到这一款（国服商城没上架），只能按品质档位估算，仅供参考"
        : "没在掌瓦商城搜到，按品质档位估算，仅供参考";
      return `<span class="price est" title="${why}">参考 ${num.toLocaleString("zh-CN")} 点券</span>`;
    }
    return "";
  }

  // ── 卡片 ────────────────────────────────────────────────────
  function skinCard(s, showWeapon) {
    const card = document.createElement("div");
    card.className = "tool-card skin-card";
    const sub = showWeapon ? (s.weapon || "") : "";
    const lv = s.level_count != null ? `${s.level_count} 级` : "";
    const ch = s.chroma_count != null ? `${s.chroma_count} 色` : "";
    const cnt = [sub, lv, ch].filter(Boolean).join(" · ");
    const price = priceChip(s);
    card.innerHTML = `<div class="art"><img src="${A(s.icon)}" alt="${esc(s.name)}" loading="lazy" onerror="__fb(this)"></div>
      <div class="card-name" title="${esc(s.name)}">${esc(s.name)}</div>
      <div class="skin-meta-row"><span class="card-meta">${esc(cnt)}</span>${price}${tierChip(s.tier_name, s.tier_color)}</div>`;
    card.addEventListener("click", () => openSkin(s));
    return card;
  }

  /* 卡片上的皮肤名：一行放不下就收字号（14px 起，最小 10px），不出「…」不折行 */
  const MEASURE_CTX = document.createElement("canvas").getContext("2d");
  function measureText(el, text, size) {
    const cs = getComputedStyle(el);
    MEASURE_CTX.font = `${cs.fontWeight} ${size}px ${cs.fontFamily}`;
    return MEASURE_CTX.measureText(text).width;
  }
  function fitCardNames(box) {
    (box || document).querySelectorAll(".skin-card .card-name").forEach((el) => {
      const text = (el.textContent || "").replace(/\s+/g, " ").trim();
      const room = Math.max(60, el.parentElement.clientWidth - 8);
      let size = 14;
      let guard = 0;
      while (size > 10 && measureText(el, text, size) > room && guard++ < 24) size -= 0.25;
      el.style.fontSize = size + "px";
    });
  }

  function paintGrid() {
    const box = $("#skins");
    box.innerHTML = "";
    let list = state.skins;
    if (state.tier) list = list.filter((s) => s.tier_name === state.tier);
    list = sortList(list);
    const total = list.length;
    if (total > MAX_ROWS) list = list.slice(0, MAX_ROWS);
    list.forEach((s) => box.appendChild(skinCard(s, !!state.q)));
    fitCardNames(box);
    $("#empty").style.display = total ? "none" : "block";
    const title = state.q ? `“${state.q}” 的搜索结果` : `${state.weaponName} · ${total} 款`;
    $("#sk-title").textContent = total > MAX_ROWS
      ? `${title}（只显示前 ${MAX_ROWS} 个，写得更具体一点更准）` : title;
    renderTierFilter();
  }

  // 视频直连 Riot CDN 播放：不下载到自己服务器，起播也快；连不上再退回本站反代
  function rawVideoUrl(video) {
    if (!video) return "";
    try {
      const q = new URL(video, location.origin).searchParams.get("u");
      return q || "";
    } catch (e) {
      return video;
    }
  }

  function renderTierFilter() {
    const box = $("#tier-filter");
    const names = [...new Set(state.skins.map((s) => s.tier_name).filter(Boolean))];
    if (names.length < 2) { box.innerHTML = ""; return; }
    const all = `<button class="tool-chip${state.tier ? "" : " on"}" data-tier="">全部</button>`;
    box.innerHTML = all + names.map((n) =>
      `<button class="tool-chip${state.tier === n ? " on" : ""}" data-tier="${esc(n)}">${esc(n)}</button>`).join("");
  }

  // ── 数据 ────────────────────────────────────────────────────
  function loadWeapons() {
    return fetch("/api/catalog/weapons").then((r) => r.json()).then((d) => {
      state.weapons = d.rows || [];
      renderWeapons();
      if (state.weapons.length) pickWeapon(state.weapons[0]);
    });
  }

  function pickWeapon(w) {
    state.weapon = w.uuid;
    state.weaponName = w.name;
    state.q = "";
    $("#gq").value = "";
    $("#gq-x").hidden = true;
    $("#gq-hint").textContent = "也可以点左边挑一把枪，只看这把枪的皮肤。";
    renderWeapons();
    $("#skins").innerHTML = `<div class="empty">正在读 ${esc(w.name)} 的皮肤…</div>`;
    fetchLite(w.uuid).then((d) => {
      state.skins = d.skins || [];
      state.tier = "";
      paintGrid();
    });
  }

  // 列表只要卡片字段：不带等级/配色明细，一份十几 KB（全量带明细要 200 多 KB）
  function fetchLite(uuid) {
    return fetch("/api/catalog/weapons/" + encodeURIComponent(uuid) + "?lite=1")
      .then((r) => r.json());
  }

  // 单款皮肤的明细，详情弹窗点开才拉
  function fetchSkin(uuid) {
    return fetch("/api/catalog/skin?uuid=" + encodeURIComponent(uuid)).then((r) => r.json());
  }

  let debounce = 0;
  $("#gq").addEventListener("input", (e) => {
    const q = e.target.value.trim();
    $("#gq-x").hidden = !q;
    clearTimeout(debounce);
    debounce = setTimeout(() => runSearch(q), 200);
  });
  $("#gq-x").addEventListener("click", () => {
    $("#gq").value = ""; $("#gq-x").hidden = true; runSearch("");
    $("#gq").focus();
  });
  $("#tier-filter").addEventListener("click", (e) => {
    const b = e.target.closest(".tool-chip[data-tier]");
    if (!b) return;
    state.tier = b.dataset.tier || "";
    paintGrid();
  });

  // ── 排序：品质 / 收藏量 / 名称，方向可切，偏好记在本机 ────────
  function syncSort() {
    document.querySelectorAll("#sort button[data-sort]").forEach((b) => {
      b.classList.toggle("on", b.dataset.sort === state.sort);
    });
    const arrow = state.desc ? "↓" : "↑";
    const hint = state.sort === "name" ? (state.desc ? "倒序" : "正序") : (state.desc ? "高到低" : "低到高");
    $("#sort-dir").textContent = `${arrow} ${hint}`;
    try {
      localStorage.setItem("valoarchive.skinsort", JSON.stringify({ sort: state.sort, desc: state.desc }));
    } catch (err) {}
  }

  $("#sort").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-sort]");
    if (!b) return;
    state.sort = b.dataset.sort;
    // 收藏/名称默认从多到少、从 A 到 Z；品质默认从高到低
    state.desc = state.sort !== "name";
    syncSort();
    paintGrid();
  });
  $("#sort-dir").addEventListener("click", () => {
    state.desc = !state.desc;
    syncSort();
    paintGrid();
  });
  (function restoreSort() {
    try {
      const saved = JSON.parse(localStorage.getItem("valoarchive.skinsort") || "null");
      if (saved && ["tier", "name"].includes(saved.sort)) {
        state.sort = saved.sort;
        state.desc = !!saved.desc;
      }
    } catch (err) {}
    syncSort();
  })();

  function runSearch(q) {
    state.q = q;
    if (!q) { pickWeaponCurrent(); return; }
    $("#gq-hint").textContent = "正在搜…";
    // 服务端筛：只回命中的那几十条，不用把 1386 款全量索引拉下来
    fetch(`/api/catalog/skins?q=${encodeURIComponent(q)}&limit=${MAX_ROWS}`)
      .then((r) => r.json())
      .then((d) => {
        const hit = d.rows || [];
        state.skins = hit;
        state.tier = "";
        $("#gq-hint").textContent = `跨 ${state.weapons.length} 把武器，共命中 ${d.total != null ? d.total : hit.length} 款皮肤。`;
        paintGrid();
      })
      .catch(() => { $("#gq-hint").textContent = "皮肤索引暂时读不到，稍后再试。"; });
  }

  function pickWeaponCurrent() {
    const w = state.weapons.find((x) => x.uuid === state.weapon);
    if (w) pickWeapon(w);
  }

  // ── 详情：等级 / 配色 / 视频 ─────────────────────────────────
  // 版式照着游戏里的枪皮展示页来：品质色铺一层底、图标+品质名做标题带，
  // 等级写成「等级 3」的大字角标，配色只留颜色名（长名字一律省略 + title 兜住）。
  const hexSoft = (hex, a) => {
    const m = /^#?([0-9a-f]{6})$/i.exec(String(hex || ""));
    if (!m) return "transparent";
    const n = parseInt(m[1], 16);
    return `rgba(${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}, ${a})`;
  };
  // 炫彩颜色：上游只在名字里写「（炫彩1 红色）」，色卡图有时加载不出来，
  // 所以本地备一份中文色名 → 颜色，保证任何时候都看得见是什么色。
  const CHROMA_HEX = {
    红色: "#d64545", 橙色: "#e8842c", 黄色: "#e0be2a", 绿色: "#3f9d5a",
    青色: "#28a8a8", 蓝色: "#3b73d6", 紫色: "#8a5cd6", 粉色: "#e077a8",
    白色: "#e8e8e8", 黑色: "#3a3a3a", 灰色: "#8b8b8b", 金色: "#d4af37",
    银色: "#c0c4c9", 棕色: "#8a5a3b", 原版: "#9aa4ad",
  };
  // 上游有些炫彩是双色（「粉/白」「红/蓝」「蓝/绿」），也有本地没收录的色名，
  // 所以这里给每个色名一个可见的兜底色，双色就画成左右对半的渐变。
  const chromaDot = (color) => {
    const key = String(color || "").trim();
    if (!key) return "#9aa4ad";
    const parts = key.split(/[\/／、+]/).map((x) => x.trim()).filter(Boolean);
    const colors = parts.map((x) => CHROMA_HEX[x] || CHROMA_HEX[x.replace(/色$/, "") + "色"] || "#9aa4ad");
    if (colors.length === 1) return colors[0];
    if (colors.length === 2) {
      return `linear-gradient(90deg, ${colors[0]} 0 50%, ${colors[1]} 50% 100%)`;
    }
    const step = 100 / colors.length;
    const stops = colors.map((c, i) => `${c} ${Math.round(i * step)}% ${Math.round((i + 1) * step)}%`);
    return `linear-gradient(90deg, ${stops.join(", ")})`;
  };
  const chromaHex = (color, swatch) => {
    const key = String(color || "").trim();
    return CHROMA_HEX[key] || (swatch ? "transparent" : "#9aa4ad");
  };

  const shortLabel = (label, base) => {
    let t = String(label || "").trim();
    if (base) t = t.split(base).join("").trim();
    t = t.replace(/^[（(\[【]\s*/, "").replace(/\s*[）)\]】]$/, "").trim();
    return t;
  };

  function openSkin(s) {
    const body = $("#skin-body");
    const tierColor = s.tier_color || "#0e7c6b";
    $("#modal .skin-modal").style.setProperty("--tier", tierColor);
    $("#modal .skin-modal").style.setProperty("--tier-soft", hexSoft(tierColor, 0.16));
    $("#modal .skin-modal").style.setProperty("--tier-line", hexSoft(tierColor, 0.55));
    body.innerHTML = `<div class="skin-hero">
        ${s.tier_icon ? `<img class="tier-ico" src="${A(s.tier_icon)}" alt="" onerror="this.remove()">` : `<span class="tier-dot"></span>`}
        <div class="skin-hero-txt">
          <div class="tier-line">${esc(s.tier_name || "未分级")}<span id="cnt">读数据…</span></div>
          <h2 title="${esc(s.name)}">${esc(s.name)}</h2>
          <div class="card-meta">${esc(s.weapon || state.weaponName)} ${priceChip(s)}</div>
          ${s.price_unknown ? `<div class="price-note">掌瓦搜索里查不到这一款（国服没上架），价格按品质档位估算，仅供参考。</div>` : ""}
        </div>
      </div>
      <div class="skin-stage">
        <video id="mv" controls loop muted playsinline preload="none" style="display:none"></video>
        <img id="mi" alt="" style="display:none">
        <button class="mv-snd" id="mv-snd" type="button" hidden>🔇 开启声音</button>
      </div>
      <div class="skin-tip" id="skin-tip"></div>
      <div class="skin-tabs-wrap">
        <div class="seg skin-tabs" id="skin-tabs" style="display:none">
          <button type="button" data-tab="levels" class="on">等级</button>
          <button type="button" data-tab="chromas">配色</button>
        </div>
        <span class="skin-hint" id="skin-hint"></span>
      </div>
      <div class="skin-tiles" id="skin-tiles"></div>`;
    $("#modal").classList.add("on");
    document.body.style.overflow = "hidden";

    fetchSkin(s.uuid).then((full) => {
      if (!full || !full.uuid) throw new Error("no detail");
      const levels = full.levels || [];
      const chromas = full.chromas || [];
      $("#cnt").textContent = `${levels.length} 级 · ${chromas.length} 色`;
      let tab = levels.length ? "levels" : "chromas";
      const items = () => (tab === "levels" ? levels : chromas);

      const tabsBox = $("#skin-tabs");
      tabsBox.style.display = "flex";
      tabsBox.querySelectorAll("button").forEach((b) => {
        const n = b.dataset.tab === "levels" ? levels.length : chromas.length;
        b.textContent = `${b.dataset.tab === "levels" ? "等级" : "配色"} ${n}`;
        b.classList.toggle("on", b.dataset.tab === tab);
        b.disabled = !n;
      });
      tabsBox.onclick = (e) => {
        const b = e.target.closest("button[data-tab]");
        if (!b || b.disabled) return;
        tab = b.dataset.tab;
        tabsBox.querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b));
        paintTiles(items(), 0);
        fitTileLabels($("#skin-tiles"));
      };

      /* 一行放不下就缩字号，不用「…」也不用折行。
         用 canvas 量文字真实宽度：overflow:visible 的元素 scrollWidth 不可靠。 */
      function fitTileLabels(box) {
        (box || document).querySelectorAll(".tile .lb").forEach((lb) => {
          const tile = lb.closest(".tile");
          if (!tile) return;
          const text = (lb.textContent || "").replace(/\s+/g, " ").trim();
          // 左右各留 3px 余量，避免文字贴边看着像要溢出去
          const room = Math.max(40, (lb.clientWidth || tile.clientWidth - 12) - 6);
          let size = 10.5;
          let guard = 0;
          while (size > 7.5 && measureText(lb, text, size) > room && guard++ < 30) size -= 0.25;
          lb.style.fontSize = size + "px";
        });
      }

      function paintTiles(list, idx) {
        const box = $("#skin-tiles");
        box.innerHTML = "";
        $("#skin-hint").textContent = tab === "levels"
          ? "同一个皮肤逐级解锁的模型，点一下换图，有视频的直接播"
          : "同一个皮肤的配色版本（炫彩），点一下换图";
        if (!list.length) {
          box.innerHTML = `<p class="hint">这一款没有${tab === "levels" ? "分级模型" : "额外配色"}。</p>`;
          const v = $("#mv"); if (v) { try { v.pause(); } catch (e) {} v.removeAttribute("src"); v.style.display = "none"; }
          return;
        }
        list.forEach((it, i) => {
          const el = document.createElement("button");
          el.type = "button";
          el.className = "tile" + (i === idx ? " on" : "");
          const art = it.icon || "";
          const isLv = tab === "levels";
          // 等级：角标写「等级 N」，名字只留去掉皮肤名后的部分（多半是空的，就写"原版"）
          const name = shortLabel(it.name, full.name || s.name);
          const color = isLv ? "" : String(it.color || "").trim();
          // 配色的一律写成「等级4炫彩1 红色」这种一眼能看懂的形式：
          // 上游名字里本来就带等级，把等级 + 第几色 + 颜色直接拼出来。
          const lvNo = Number(it.level || 0);
          const chNo = Number(it.index || 0);
          const label = isLv
            ? `等级 ${it.level || i + 1}`
            : (color
                ? `${lvNo ? `等级${lvNo} ` : ""}${chNo ? `炫彩${chNo} ` : ""}${color}`
                : (name || (i === 0 ? "原版" : `配色 ${i + 1}`)));
          el.title = it.name || label;
          const dot = color
            ? `<i class="cdot" style="background:${chromaDot(color)}"></i>` : "";
          el.innerHTML = `${isLv ? `<span class="lvn">${it.level || i + 1}</span>` : ""}
            ${!isLv && (it.swatch || color)
              ? `<div class="art"><span class="sw" style="background-color:${chromaHex(color, it.swatch)};${it.swatch ? `background-image:url('${A(it.swatch)}')` : ""};background-position:center;background-size:cover"></span></div>`
              : art ? `<div class="art"><img src="${A(art)}" alt="" loading="lazy" onerror="__fb(this)"></div>` : `<div class="art"></div>`}
            ${it.video ? `<span class="vmark" title="点开有演示视频">▶</span>` : ""}
            <div class="lb">${dot}${esc(label)}</div>`;
          el.addEventListener("click", () => {
            box.querySelectorAll(".tile").forEach((x) => x.classList.toggle("on", x === el));
            setMedia(it, tab);
          });
          box.appendChild(el);
        });
      }

      paintTiles(items(), 0);
      setMedia(items()[0] || {}, tab);
      fitTileLabels(box);
    }).catch(() => { $("#cnt").textContent = "细节数据读不到"; });
  }

  function setMedia(it, tab) {
    const v = $("#mv"), img = $("#mi"), tip = $("#skin-tip"), snd = $("#mv-snd");
    const poster = it.icon || "";
    if (it.video) {
      img.style.display = "none";
      v.style.display = "block";
      v.poster = A(poster);
      // 只连官方 CDN 原地址：本站不过视频流量，连不上就明确提示，不偷偷回落到本站反代
      const direct = rawVideoUrl(it.video) || it.video;
      if (v.dataset.src !== direct) {
        v.dataset.src = direct;
        delete v.dataset.dead;
        v.style.display = "block";
        img.style.display = "none";
        v.src = direct;
        v.load();
      }
      const p = v.play();
      if (p && p.catch) p.catch(() => {});
      if (snd) snd.hidden = false;
      const ready = tab === "levels" ? "这个等级下的官方实战演示，默认静音，想听声音点右上角喇叭。" : "这个配色下的官方实战演示，默认静音，想听声音点右上角喇叭。";
      tip.textContent = "正在加载演示视频…";
      const settled = () => { tip.textContent = ready; };
      v.addEventListener("playing", settled, { once: true });
      v.addEventListener("loadeddata", settled, { once: true });
      clearTimeout(setMedia.slow);
      setMedia.slow = setTimeout(() => {
        if (!v.dataset.dead && v.readyState < 3) tip.textContent = "视频还在缓冲（官方素材几十 MB，网速一般要等几秒）。";
      }, 3000);
    } else {
      try { v.pause(); } catch (e) {}
      v.style.display = "none";
      v.removeAttribute("src");
      if (snd) snd.hidden = true;
      img.style.display = "block";
      img.src = A(it.full || it.icon || poster);
      tip.textContent = "官方这一项没有录演示视频，只能看模型图。";
    }
  }

  // 默认静音播放（手机不静音会被浏览器拦），要看声音自己点这个喇叭
  function syncSnd() {
    const v = $("#mv"), snd = $("#mv-snd");
    if (!v || !snd) return;
    snd.textContent = v.muted ? "🔇 开启声音" : "🔊 静音";
    snd.setAttribute("aria-pressed", v.muted ? "false" : "true");
  }

  function closeModal() {
    const v = $("#mv");
    if (v) {
      try { v.pause(); } catch (e) {}
      v.removeAttribute("src");
      delete v.dataset.src;
    }
    $("#modal").classList.remove("on");
    document.body.style.overflow = "";
  }

  // 官方 CDN 连不上时：收起视频，回到静态图 + 一句人话，绝不用本站流量硬顶
  function videoFailed() {
    const v = $("#mv"), img = $("#mi"), tip = $("#skin-tip"), snd = $("#mv-snd");
    if (!v || v.style.display === "none") return;
    try { v.pause(); } catch (e) {}
    v.removeAttribute("src");
    delete v.dataset.src;
    v.dataset.dead = "1";
    v.style.display = "none";
    if (snd) snd.hidden = true;
    if (img && v.poster) img.src = v.poster;
    if (img) img.style.display = "block";
    if (tip) tip.textContent = "官方服务器连接不上，这段演示视频暂时看不了；图片还能正常看。";
  }
  // 视频元素是弹窗渲染时插进来的，所以用捕获阶段在 #modal 上听（error 不冒泡）
  $("#modal").addEventListener("error", (e) => {
    if (e.target && e.target.id === "mv") videoFailed();
  }, true);
  $("#modal").addEventListener("stalled", () => setTimeout(() => {
    const v = $("#mv");
    if (v && v.style.display !== "none" && v.readyState < 2) videoFailed();
  }, 8000), true);
  $("#modal").addEventListener("click", (e) => {
    if (e.target.closest("#mv-snd")) {
      const v = $("#mv");
      if (v) { v.muted = !v.muted; if (!v.muted) v.volume = 1; syncSnd(); }
      return;
    }
    if (e.target.id === "modal") closeModal();
  });
  // 音量/静音状态变了就同步按钮文案（volumechange 不冒泡，用捕获阶段听）
  $("#modal").addEventListener("volumechange", syncSnd, true);
  $("#modal-x").addEventListener("click", closeModal);
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && $("#modal").classList.contains("on")) closeModal(); });

  loadWeapons().catch(() => {
    $("#empty").style.display = "block";
    $("#empty").textContent = "皮肤数据暂时读不到，稍后再试。";
  });
})();
</script>
