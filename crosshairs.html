<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>准星库 · VALO ARCHIVE</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg?v=4" sizes="any" />
<link rel="stylesheet" href="/static/style.css?v=eda648eab4" />
<link rel="stylesheet" href="/static/tools.css?v=86d3790d44" />
</head>
<body>
<div class="grid-bg" aria-hidden="true"></div>

<div class="tool-page">
  <nav class="tool-nav">
    <a href="/">← 回首页</a>
    <a href="/crosshairs" class="on">准星库</a>
    <a href="/lineups">点位库</a>
    <a href="/catalog/agents">英雄库</a>
    <a href="/catalog/skins">皮肤库</a>
    <a href="/catalog/cosmetics">个性库</a>
    <a href="/status">状态</a>
  </nav>
  <div class="tool-head">
    <div>
      <h1>准星库</h1>
      <div class="sub">点「复制代码」直接进游戏用；不满意就点「改样式」到准星生成器里自己调。</div>
    </div>
    <div class="tool-actions">
      <a class="btn small" href="/crosshair">准星生成器</a>
      <a class="btn small" href="/lineups">点位库</a>
      <a class="btn small" href="/catalog/agents">英雄库</a>
      <a class="btn small" href="/catalog/skins">皮肤库</a>
      <a class="btn small" href="/catalog/cosmetics">个性库</a>
      <a class="btn small" href="/">回首页</a>
    </div>
  </div>

  <div class="toolbar">
    <div class="chips" id="tag-chips">
      <button class="tool-chip on" data-tag="">全部</button>
      <button class="tool-chip" data-tag="dot">点</button>
      <button class="tool-chip" data-tag="cross">十字</button>
      <button class="tool-chip" data-tag="long">长十字</button>
    </div>
    <input class="input search" id="search" placeholder="搜名字 / 标签" />
    <span class="tool-count" id="count"></span>
    <button class="btn small" id="open-form">发布我的准星</button>
  </div>

  <div class="cards" id="cards"></div>
  <div class="more-row"><button class="btn small" id="more" hidden>加载更多</button></div>
  <div class="empty" id="empty" style="display: none">这个筛选下还没有内容。</div>

  <div class="card-panel" id="form" style="display: none; margin-top: 20px">
    <div class="panel-title">发布到准星库</div>
    <div class="field-row">
      <label class="field"><span>名字</span><input class="input" id="f-name" maxlength="40" placeholder="例：小十字 · 绿" /></label>
      <label class="field"><span>标签（空格分隔，可选 dot / cross / long）</span><input class="input" id="f-tags" maxlength="40" placeholder="cross" /></label>
    </div>
    <label class="field"><span>准星代码（游戏内「设置 → 准星 → 分享代码」，以 0; 开头）</span><textarea class="textarea" id="f-code" maxlength="400"></textarea></label>
    <label class="field"><span>作者（可留空）</span><input class="input" id="f-author" maxlength="24" /></label>
    <div class="btn-row">
      <button class="btn primary" id="submit">发布</button>
      <button class="btn" id="close-form">取消</button>
    </div>
  </div>

  <div class="legal">
    准星代码是游戏内可分享的配置串，不含账号信息；条目由玩家自行发布，最终效果以游戏内为准。
    非官方工具，与 Riot Games / 腾讯无关。
  </div>
</div>

<div class="tool-toast" id="toast"></div>

<script src="/static/share-kit.js?v=cbd81f69b7"></script>
<script>
(function () {
  const $ = (s) => document.querySelector(s);
  const toastEl = $("#toast");
  let toastTimer = 0;
  const toast = (text) => {
    toastEl.textContent = text;
    toastEl.classList.add("on");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove("on"), 1800);
  };

  let tag = "";
  let keyword = "";

  function card(row) {
    const box = document.createElement("div");
    box.className = "tool-card";

    const frame = document.createElement("div");
    frame.className = "preview-box";
    const canvas = document.createElement("canvas");
    canvas.width = 220;
    canvas.height = 132;
    frame.appendChild(canvas);
    box.appendChild(frame);

    try {
      ShareKit.drawCrosshair(canvas, ShareKit.parseCrosshair(row.code), { size: 132 });
    } catch (err) { /* 画不出来就留空底 */ }

    const name = document.createElement("div");
    name.className = "card-name";
    name.textContent = row.name || "未命名";
    box.appendChild(name);

    const meta = document.createElement("div");
    meta.className = "card-meta";
    meta.textContent = [row.heat ? "热度 " + row.heat : "", row.tags || ""].filter(Boolean).join(" · ") || "社区";
    box.appendChild(meta);

    const actions = document.createElement("div");
    actions.className = "btn-row";
    actions.style.marginTop = "2px";

    const copy = document.createElement("button");
    copy.className = "btn small primary";
    copy.style.flex = "1";
    copy.textContent = "复制代码";
    copy.addEventListener("click", async () => {
      await ShareKit.copyText(row.code);
      toast("代码已复制");
    });

    const tune = document.createElement("a");
    tune.className = "btn small";
    tune.style.flex = "1";
    tune.textContent = "改样式";
    tune.href = "/crosshair?code=" + encodeURIComponent(row.code);

    actions.appendChild(copy);
    actions.appendChild(tune);
    box.appendChild(actions);
    return box;
  }

  const PAGE = 96;
  let allRows = [];
  let shown = 0;

  function paintMore(step) {
    const grid = $("#cards");
    const next = Math.min(allRows.length, shown + step);
    for (let i = shown; i < next; i += 1) grid.appendChild(card(allRows[i]));
    shown = next;
    const more = $("#more");
    const left = allRows.length - shown;
    more.hidden = left <= 0;
    if (left > 0) more.textContent = "再看 " + Math.min(PAGE, left) + " 款（还剩 " + left + "）";
  }

  async function load() {
    const url = "/api/library/crosshairs?limit=800"
      + "&tag=" + encodeURIComponent(tag)
      + "&q=" + encodeURIComponent(keyword);
    const grid = $("#cards");
    grid.innerHTML = "";
    allRows = [];
    shown = 0;
    try {
      const data = await (await fetch(url)).json();
      allRows = data.rows || [];
    } catch (err) {
      toast("库暂时读不到，稍后再试");
    }
    $("#empty").style.display = allRows.length ? "none" : "block";
    const countEl = $("#count");
    if (countEl) countEl.textContent = allRows.length ? "共 " + allRows.length + " 款" : "";
    paintMore(PAGE);
  }

  $("#more").addEventListener("click", () => paintMore(PAGE));

  $("#tag-chips").addEventListener("click", (ev) => {
    const chip = ev.target.closest(".tool-chip[data-tag]");
    if (!chip) return;
    document.querySelectorAll("#tag-chips .tool-chip").forEach((c) => c.classList.remove("on"));
    chip.classList.add("on");
    tag = chip.dataset.tag;
    load();
  });

  let debounce = 0;
  $("#search").addEventListener("input", (ev) => {
    clearTimeout(debounce);
    debounce = setTimeout(() => {
      keyword = ev.target.value.trim();
      load();
    }, 240);
  });

  $("#open-form").addEventListener("click", () => {
    const form = $("#form");
    form.style.display = form.style.display === "none" ? "block" : "none";
  });
  $("#close-form").addEventListener("click", () => { $("#form").style.display = "none"; });

  $("#submit").addEventListener("click", async () => {
    const payload = {
      name: $("#f-name").value.trim(),
      code: $("#f-code").value.trim(),
      tags: $("#f-tags").value.trim(),
      author: $("#f-author").value.trim(),
    };
    if (!payload.code.startsWith("0;")) return toast("代码要以 0; 开头");
    const btn = $("#submit");
    btn.disabled = true;
    const res = await fetch("/api/library/crosshairs", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    btn.disabled = false;
    if (res.status === 401) return toast("提交准星要先登录：打开 /account 注册或登录");
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      return toast(err.detail || "发布失败");
    }
    toast("已发布");
    $("#form").style.display = "none";
    ["f-name", "f-code", "f-tags", "f-author"].forEach((id) => { $("#" + id).value = ""; });
    load();
  });

  load();
})();
</script>
<script src="/static/statusdot.js?v=e4f8a35baa" defer></script>
</body>
</html>
