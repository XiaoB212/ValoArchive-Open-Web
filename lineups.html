<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>点位分享 · VALO ARCHIVE</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg?v=4" sizes="any" />
<link rel="stylesheet" href="/static/style.css?v=147" />
<style>
  body { background: var(--bg, #0b0d10); }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 28px 18px 60px; }
  .hd { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
  .hd h1 { font-size: 22px; margin: 0; letter-spacing: .04em; }
  .hd .sub { color: var(--muted, #8b93a1); font-size: 12px; }
  .cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; }
  @media (max-width: 820px) { .cols { grid-template-columns: 1fr; } }
  .panel { background: var(--card, #14171c); border: 1px solid var(--line, #262b33); border-radius: 10px; padding: 16px; }
  .panel h2 { font-size: 13px; margin: 0 0 12px; color: var(--muted, #8b93a1); letter-spacing: .08em; }
  label.f { display: block; font-size: 12px; color: var(--muted, #8b93a1); margin: 10px 0 5px; }
  input.t, textarea.t, select.t { width: 100%; box-sizing: border-box; background: #0e1116; color: #e8ecf1; border: 1px solid #2a3038; border-radius: 7px; padding: 9px 10px; font: inherit; font-size: 13px; }
  textarea.t { min-height: 84px; resize: vertical; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .row { display: flex; gap: 9px; flex-wrap: wrap; margin-top: 14px; }
  .b { border: 1px solid #2a3038; background: #1a1f26; color: #e8ecf1; border-radius: 7px; padding: 9px 14px; font: inherit; font-size: 13px; cursor: pointer; }
  .b.pri { background: #0e7c6b; border-color: #0e7c6b; color: #fff; }
  .drop { border: 1px dashed #333b45; border-radius: 9px; padding: 16px; text-align: center; color: var(--muted, #8b93a1); font-size: 12px; cursor: pointer; }
  .drop.on { border-color: #0e7c6b; color: #9fe0d5; }
  .shot { max-width: 100%; border-radius: 9px; display: block; margin-top: 12px; }
  .shot.hidden { display: none; }
  .hint { font-size: 12px; color: var(--muted, #8b93a1); line-height: 1.7; margin-top: 10px; }
  .share-only { display: none; }
  body.share .editor-only { display: none; }
  body.share .share-only { display: block; }
  .meta { font-size: 13px; color: #cfd7e2; margin: 4px 0; }
  .meta b { color: #fff; }
  .legal { margin-top: 26px; font-size: 11px; color: #6d7684; line-height: 1.8; }
  .toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); background: #222932; color: #fff; padding: 9px 16px; border-radius: 999px; font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .2s; }
  .toast.on { opacity: 1; }
</style>
</head>
<body>
<div class="wrap">
  <div class="hd">
    <div>
      <h1>点位分享</h1>
      <div class="sub">地图 + 英雄 + 截图 + 说明，生成一条自带内容的链接</div>
    </div>
    <a class="b" href="index.html">← 回档案首页</a>
  </div>

  <div class="cols">
    <div class="panel editor-only">
      <h2>点位信息</h2>
      <div class="two">
        <div>
          <label class="f" for="p-map">地图</label>
          <select class="t" id="p-map">
            <option>亚海悬城</option><option>隐世修所</option><option>森寒冬港</option>
            <option>裂变峡谷</option><option>微风岛屿</option><option>莲华古城</option>
            <option>遗落境地</option><option>源工重镇</option><option>霓虹町</option>
            <option>幽邃地窟</option><option>盐海矿镇</option><option>天枢云阙</option>
            <option>深窟幽境</option><option>日落之城</option><option>其他</option>
          </select>
        </div>
        <div>
          <label class="f" for="p-agent">英雄</label>
          <input class="t" id="p-agent" maxlength="16" placeholder="例：贤者 / 猎枭" />
        </div>
      </div>
      <div class="two">
        <div>
          <label class="f" for="p-side">阵营</label>
          <select class="t" id="p-side"><option>进攻</option><option>防守</option><option>通用</option></select>
        </div>
        <div>
          <label class="f" for="p-site">点位</label>
          <input class="t" id="p-site" maxlength="20" placeholder="例：A 大 / B 点箱后" />
        </div>
      </div>
      <label class="f" for="p-title">标题</label>
      <input class="t" id="p-title" maxlength="40" placeholder="例：A 大烟 · 从出生点" />
      <label class="f" for="p-note">做法 / 说明</label>
      <textarea class="t" id="p-note" maxlength="600" placeholder="站哪里、瞄哪里、几段跳、给谁看…"></textarea>
      <label class="f" for="p-author">作者（可留空）</label>
      <input class="t" id="p-author" maxlength="30" />

      <label class="f">截图（可粘贴剪贴板 / 点选文件）</label>
      <div class="drop" id="p-drop">点这里选图，或直接 Ctrl+V 粘贴截图</div>
      <img class="shot hidden" id="p-shot" alt="点位截图" />
      <input type="file" id="p-file" accept="image/*" hidden />

      <div class="row">
        <button class="b pri" id="p-make">生成分享链接</button>
        <button class="b" id="p-clear">清空</button>
      </div>
      <div class="hint">截图会自动压到 1000px 宽并转成 JPEG，再塞进链接里；太大的图会提示换一张。链接不经过任何服务器。</div>
    </div>

    <div class="panel share-only" id="share-card">
      <h2>分享内容</h2>
      <div class="meta" id="s-meta"></div>
      <img class="shot hidden" id="s-shot" alt="点位截图" />
      <div class="hint" id="s-note"></div>
      <div class="row">
        <button class="b pri" id="s-copy-link">复制本页链接</button>
      </div>
    </div>

    <div class="panel editor-only">
      <h2>预览</h2>
      <div class="meta" id="p-preview-meta">还没填内容</div>
      <img class="shot hidden" id="p-preview" alt="预览" />
    </div>
  </div>

  <div class="legal">
    本页为非官方社区工具，与 Riot Games / 腾讯无关；点位由玩家自行提供，仅供参考。
    链接内容全部写在地址栏里，本站不保存你的点位与截图。
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="/static/share-kit.js?v=1"></script>
<script>
(function () {
  const $ = (s) => document.querySelector(s);
  const toastEl = $("#toast");
  let timer = 0;
  const toast = (text) => {
    toastEl.textContent = text;
    toastEl.classList.add("on");
    clearTimeout(timer);
    timer = setTimeout(() => toastEl.classList.remove("on"), 2000);
  };

  let shot = ""; // data URL

  function metaOf(d) {
    const bits = [d.map, d.agent, d.side, d.site].filter(Boolean);
    return bits.join(" · ") || "未填写";
  }

  function refreshPreview() {
    const d = readForm();
    $("#p-preview-meta").textContent = `${metaOf(d)}${d.title ? " ｜ " + d.title : ""}`;
    const img = $("#p-preview");
    if (shot) { img.src = shot; img.classList.remove("hidden"); }
    else { img.classList.add("hidden"); }
  }

  function readForm() {
    return {
      map: $("#p-map").value,
      agent: $("#p-agent").value.trim(),
      side: $("#p-side").value,
      site: $("#p-site").value.trim(),
      title: $("#p-title").value.trim(),
      note: $("#p-note").value.trim(),
      author: $("#p-author").value.trim(),
    };
  }

  async function compressImage(fileOrBlob, maxWidth) {
    const bitmap = await createImageBitmap(fileOrBlob);
    const scale = Math.min(1, (maxWidth || 1000) / bitmap.width);
    const w = Math.max(1, Math.round(bitmap.width * scale));
    const h = Math.max(1, Math.round(bitmap.height * scale));
    const canvas = document.createElement("canvas");
    canvas.width = w;
    canvas.height = h;
    canvas.getContext("2d").drawImage(bitmap, 0, 0, w, h);
    return canvas.toDataURL("image/jpeg", 0.72);
  }

  async function takeImage(blob) {
    try {
      shot = await compressImage(blob, 1000);
      if (shot.length > 520000) {
        shot = await compressImage(blob, 720);
      }
      if (shot.length > 700000) {
        shot = "";
        return toast("截图太大了，换一张小一点的（或先裁掉无关区域）");
      }
      refreshPreview();
      toast("截图已就绪");
    } catch (err) {
      toast("这张图读不出来，换一张试试");
    }
  }

  $("#p-drop").addEventListener("click", () => $("#p-file").click());
  $("#p-file").addEventListener("change", (ev) => {
    const file = ev.target.files && ev.target.files[0];
    if (file) takeImage(file);
  });
  document.addEventListener("paste", (ev) => {
    const item = [...(ev.clipboardData ? ev.clipboardData.items : [])].find((i) => i.type.startsWith("image/"));
    if (item) takeImage(item.getAsFile());
  });
  ["p-map", "p-agent", "p-side", "p-site", "p-title", "p-note", "p-author"].forEach((id) => {
    $("#" + id).addEventListener("input", refreshPreview);
  });
  $("#p-side").addEventListener("change", refreshPreview);

  $("#p-clear").addEventListener("click", () => {
    shot = "";
    ["p-agent", "p-site", "p-title", "p-note", "p-author"].forEach((id) => { $("#" + id).value = ""; });
    refreshPreview();
  });

  $("#p-make").addEventListener("click", async () => {
    const d = readForm();
    if (!d.title && !d.note) return toast("至少写个标题或说明");
    const payload = await ShareKit.pack({ t: "lineup", ...d, img: shot });
    if (payload.length > 300000) return toast("内容太大，换张小一点的截图");
    const url = `${location.origin}${location.pathname}#${payload}`;
    history.replaceState(null, "", "#" + payload);
    await ShareKit.copyText(url);
    showShare(payload);
    toast("分享链接已复制");
  });

  async function showShare(hash) {
    const d = await ShareKit.unpack(hash);
    if (!d || !(d.title || d.note)) return false;
    document.body.classList.add("share");
    $("#s-meta").innerHTML = `<b>${metaOf(d)}</b>${d.title ? " ｜ " + escapeHtml(d.title) : ""}${d.author ? " · by " + escapeHtml(d.author) : ""}`;
    $("#s-note").textContent = d.note || "";
    if (d.img) { $("#s-shot").src = d.img; $("#s-shot").classList.remove("hidden"); }
    $("#s-copy-link").onclick = async () => { await ShareKit.copyText(location.href); toast("链接已复制"); };
    return true;
  }

  function escapeHtml(text) {
    return String(text || "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  const hash = location.hash.replace(/^#/, "");
  if (hash) showShare(hash).then((ok) => { if (!ok) toast("链接内容不完整，已切回编辑模式"); });
})();
</script>
</body>
</html>
