<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>点位库 · VALO ARCHIVE</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg?v=4" sizes="any" />
<link rel="stylesheet" href="/static/style.css?v=eda648eab4" />
<link rel="stylesheet" href="/static/tools.css?v=86d3790d44" />
<style>
  .lineup-card { cursor: pointer; }
  .lineup-card .shot { height: 118px; width: 100%; object-fit: cover; border-radius: 9px; background: var(--paper-2); margin: 0; }
  /* 弹窗外壳、关闭按钮统一由 tools.css 提供，这里只管点位详情自己的排版 */
  .img-fallback { display: grid; place-items: center; min-height: 118px; border: 1px dashed var(--line-strong);
    border-radius: 10px; background: var(--paper-2); color: var(--ink-3, #78848a); font-size: 12px; padding: 12px; }
  .img-fallback.big { min-height: 220px; }
  .meta-row { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0 0; }
  .pill { border: 1px solid var(--line-strong); border-radius: 999px; padding: 3px 10px; font-size: 11px; color: var(--ink-2); }
  /* 详情：左边地图俯视图（带站位/落点标记），右边分步图 */
  .detail-grid { display: grid; grid-template-columns: minmax(260px, 360px) 1fr; gap: 16px; align-items: start; }
  @media (max-width: 780px) { .detail-grid { grid-template-columns: 1fr; } }
  .mini { position: relative; background: #101418; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); }
  .mini img { display: block; width: 100%; height: auto; opacity: .92; }
  .mk { position: absolute; transform: translate(-50%, -50%); }
  .mk-player { width: 13px; height: 13px; border-radius: 50%; background: #38e08a; border: 2px solid #0b0d10; box-shadow: 0 0 0 2px rgba(56,224,138,.28); }
  .mk-util { width: 22px; height: 22px; }
  .mk-util::before, .mk-util::after { content: ""; position: absolute; left: 50%; top: 50%; background: #ff4655; }
  .mk-util::before { width: 22px; height: 2px; transform: translate(-50%, -50%); }
  .mk-util::after { width: 2px; height: 22px; transform: translate(-50%, -50%); }
  .legend { display: flex; gap: 14px; font-size: 11px; color: var(--ink-2); margin-top: 8px; }
  .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: #38e08a; margin-right: 5px; }
  .legend i.cross { border-radius: 0; background: #ff4655; width: 10px; height: 2px; vertical-align: middle; }
  .steps { display: grid; gap: 12px; }
  .step { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--paper-2); }
  .step img { display: block; width: 100%; height: auto; }
  .step figcaption { padding: 9px 12px; font-size: 13px; color: var(--ink); line-height: 1.6; }
  .step b { color: var(--accent, #ff4655); margin-right: 6px; }
  .detail-desc { margin: 10px 0 0; font-size: 13px; line-height: 1.75; color: var(--ink-2); white-space: pre-wrap; }
</style>
</head>
<body>
<div class="grid-bg" aria-hidden="true"></div>

<div class="tool-page">
  <nav class="tool-nav">
    <a href="/">← 回首页</a>
    <a href="/crosshairs">准星库</a>
    <a href="/lineups" class="on">点位库</a>
    <a href="/catalog/agents">英雄库</a>
    <a href="/catalog/skins">皮肤库</a>
    <a href="/catalog/cosmetics">个性库</a>
    <a href="/status">状态</a>
  </nav>
  <div class="tool-head">
    <div>
      <h1>点位库</h1>
      <div class="sub">按地图、英雄、攻防筛；点卡片看大图与原图。图片第一次打开时会缓存到本地，之后更快。</div>
    </div>
    <div class="tool-actions">
      <button class="btn small" id="open-form">上传点位</button>
      <a class="btn small" href="/crosshairs">准星库</a>
      <a class="btn small" href="/catalog/agents">英雄库</a>
      <a class="btn small" href="/catalog/skins">皮肤库</a>
      <a class="btn small" href="/catalog/cosmetics">个性库</a>
      <a class="btn small" href="/">回首页</a>
    </div>
  </div>

  <div class="card-panel" style="margin-bottom: 18px">
    <div class="panel-title">地图</div>
    <div class="chips" id="maps" style="margin-bottom: 12px"></div>
    <div class="panel-title">英雄</div>
    <div class="chips" id="agents" style="margin-bottom: 12px"></div>
    <div class="toolbar" style="margin-bottom: 0">
      <div class="chips" id="sides"></div>
      <input class="input search" id="q" placeholder="搜标题 / 说明" />
      <span class="hint" id="count"></span>
    </div>
  </div>

  <div class="cards" id="cards"></div>
  <div class="empty" id="empty" style="display: none">这个筛选下还没有点位。</div>

  <div class="card-panel" id="form" style="display: none; margin-top: 20px">
    <div class="panel-title">上传点位</div>
    <div class="field-row">
      <label class="field"><span>地图</span><input class="input" id="f-map" placeholder="例：亚海悬城" /></label>
      <label class="field"><span>英雄</span><input class="input" id="f-agent" placeholder="例：猎枭" /></label>
    </div>
    <div class="field-row">
      <label class="field"><span>攻防</span><input class="input" id="f-side" placeholder="进攻 / 防守" /></label>
      <label class="field"><span>点位</span><input class="input" id="f-site" placeholder="A / B / 中场" /></label>
    </div>
    <label class="field"><span>标题</span><input class="input" id="f-title" maxlength="60" /></label>
    <label class="field"><span>说明</span><textarea class="textarea" id="f-note" maxlength="600"></textarea></label>
    <label class="field"><span>截图（可选，≤3MB）</span><input class="input" type="file" id="f-file" accept="image/*" /></label>
    <div class="btn-row">
      <button class="btn primary" id="submit">发布</button>
      <button class="btn" id="close-form">取消</button>
    </div>
  </div>

  <div class="legal">
    点位内容由社区玩家分享、或来自公开目录的元数据，仅供参考，落点请以自己在自定义房间的实测为准。
    非官方工具，与 Riot Games / 腾讯无关。
  </div>
</div>

<div class="modal" id="modal"><div class="modal-card" id="modal-body-wrap"><button class="modal-x" id="modal-x" type="button" aria-label="关闭">✕</button><div id="modal-body"></div></div></div>
<div class="tool-toast" id="toast"></div>

<script src="/static/config.js?v=5159ad9f1b"></script>

<script>
(function () {
  const $ = (s) => document.querySelector(s);
  const toastEl = $("#toast");
  let toastTimer = 0;
  const toast = (t) => {
    toastEl.textContent = t; toastEl.classList.add("on");
    clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.remove("on"), 1800);
  };

  const esc = (t) => String(t || "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  // 两种图源别混：valorant-api 的地图俯视图走通用 /img 代理，点位截图走点位图代理
  // （后者只放行那几个点位图床，塞错就会被判 400）。
  const A = (u) => (window.valoAsset ? window.valoAsset(u) : u);
  const img = (u) => {
    if (!u) return "";
    const s = String(u);
    if (!s.startsWith("http")) return A(s);
    const url = s.includes("valorant-api.com")
      ? "/img?url=" + encodeURIComponent(s)
      : "/api/lineups/img?u=" + encodeURIComponent(s);
    return A(url);
  };
  const PURPOSE = { ENTRY: "进点用", INFO: "拿信息", ANTI_RUSH: "防快攻", RETAKE: "回防用", SITE_HOLD: "守点",
    ANTI_DEFUSE: "防拆包", FLASH_ASSIST: "辅助闪光", POST_PLANT: "下包后", SMOKE: "封烟", MOLLY: "燃烧瓶" };
  const purposeCn = (p) => PURPOSE[p] || p || "";

  const state = { map: "", agent: "", side: "", q: "" };
  let rows = [];

  function chipRow(box, values, key, label) {
    box.innerHTML = "";
    const all = document.createElement("button");
    all.className = "tool-chip on"; all.textContent = "全部"; all.dataset.v = "";
    box.appendChild(all);
    values.forEach((v) => {
      const b = document.createElement("button");
      b.className = "tool-chip"; b.textContent = v; b.dataset.v = v;
      box.appendChild(b);
    });
    box.addEventListener("click", (e) => {
      const b = e.target.closest(".tool-chip");
      if (!b) return;
      box.querySelectorAll(".tool-chip").forEach((x) => x.classList.remove("on"));
      b.classList.add("on");
      state[key] = b.dataset.v;
      load();
    });
    if (label) return;
  }

  function card(row) {
    const box = document.createElement("div");
    box.className = "tool-card lineup-card";
    const img = document.createElement("img");
    img.className = "shot"; img.loading = "lazy"; img.alt = row.title || "";
    img.src = row.thumb ? A(row.thumb) : "/static/favicon.svg";
    img.onerror = () => { img.onerror = null; img.replaceWith(fallbackBox()); };
    box.appendChild(img);
    const title = document.createElement("div");
    title.className = "card-name"; title.textContent = row.title || "未命名";
    box.appendChild(title);
    const meta = document.createElement("div");
    meta.className = "card-meta";
    meta.textContent = [row.map, row.agent, row.side, row.site, row.area].filter(Boolean).join(" · ");
    box.appendChild(meta);
    box.addEventListener("click", () => openDetail(row.id));
    return box;
  }

  async function openDetail(id) {
    const res = await fetch("/api/library/lineups/" + id);
    if (!res.ok) return toast("这条点位读不到了");
    const row = await res.json();
    const pills = [row.map, row.agent, row.side, row.site, row.area, row.difficulty,
      purposeCn(row.purpose), row.stability, row.penetration && ("穿点 " + row.penetration),
      row.duration].filter(Boolean).map((x) => `<span class="pill">${x}</span>`).join("");

    // 地图俯视图 + 两个标记：绿点=站位，红叉=落点（来自目录里的百分比坐标）
    const hasMap = row.map_icon && (row.player_x != null || row.util_x != null);
    const mk = (cls, x, y) => (x == null || y == null) ? ""
      : `<span class="mk ${cls}" style="left:${Number(x)}%;top:${Number(y)}%"></span>`;
    const mini = hasMap ? `<div>
        <div class="mini">
          <img src="${img(row.map_icon)}" alt="${row.map || ""} 地图">
          ${mk("mk-player", row.player_x, row.player_y)}
          ${mk("mk-util", row.util_x, row.util_y)}
        </div>
        <div class="legend"><span><i></i>站位</span><span><i class="cross"></i>落点</span></div>
      </div>` : (row.full ? `<img class="big" src="${img(row.full)}" alt="" onerror="imgFail(this)">` : "");

    const steps = (row.steps || []).map((st, i) => `<figure class="step">
        <img src="${img(st.url)}" alt="第 ${i + 1} 步" loading="lazy" onerror="imgFail(this)">
        <figcaption><b>${i + 1}</b>${st.desc || "（这一步没有文字说明，看图中的落点标记）"}</figcaption>
      </figure>`).join("");

    const tags = (row.tags || "").split(",").filter(Boolean)
      .map((t) => `<span class="pill">#${t}</span>`).join("");

    $("#modal-body").innerHTML = `<h2 style="margin:0 0 6px">${row.title || ""}</h2>
      <div class="meta-row">${pills}</div>
      ${row.desc ? `<p class="detail-desc">${esc(row.desc)}</p>` : ""}
      <div class="detail-grid" style="margin-top:14px">
        ${mini}
        <div class="steps">${steps || `<p class="hint">这条点位只有一张示意图</p><img class="big" src="${img(row.full)}" alt="" onerror="imgFail(this)">`}</div>
      </div>
      ${tags ? `<div class="meta-row" style="margin-top:12px">${tags}</div>` : ""}
      ${row.note && row.note !== row.desc ? `<p class="hint" style="margin-top:10px">${esc(row.note)}</p>` : ""}`;
    $("#modal").classList.add("on");
    document.body.style.overflow = "hidden";
  }

  async function load() {
    const url = "/api/library/lineups?limit=400"
      + "&map=" + encodeURIComponent(state.map)
      + "&agent=" + encodeURIComponent(state.agent)
      + "&side=" + encodeURIComponent(state.side)
      + "&q=" + encodeURIComponent(state.q);
    const grid = $("#cards");
    grid.innerHTML = "";
    const data = await (await fetch(url)).json();
    rows = data.rows || [];
    const maps = {}, agents = {}, sides = {};
    rows.forEach((r) => {
      if (r.map) maps[r.map] = 1;
      if (r.agent) agents[r.agent] = 1;
      if (r.side) sides[r.side] = 1;
    });
    if (!state._init) {
      chipRow($("#maps"), Object.keys(maps), "map");
      chipRow($("#agents"), Object.keys(agents), "agent");
      chipRow($("#sides"), Object.keys(sides), "side");
      state._init = true;
    }
    rows.forEach((r) => grid.appendChild(card(r)));
    $("#empty").style.display = rows.length ? "none" : "block";
    $("#count").textContent = rows.length + " 条";
  }

  let debounce = 0;
  $("#q").addEventListener("input", (e) => {
    clearTimeout(debounce);
    debounce = setTimeout(() => { state.q = e.target.value.trim(); load(); }, 240);
  });

  function closeModal() { $("#modal").classList.remove("on"); document.body.style.overflow = ""; }
  window.imgFail = (el) => {
    const box = document.createElement("div");
    box.className = (el.classList.contains("big") ? "img-fallback big" : "img-fallback");
    box.textContent = "这张图暂时打不开";
    el.replaceWith(box);
  };
  function fallbackBox() {
    const box = document.createElement("div");
    box.className = "img-fallback";
    box.textContent = "缩略图暂时打不开";
    box.style.height = "118px";
    return box;
  }
  $("#modal-x").addEventListener("click", closeModal);
  $("#modal").addEventListener("click", (e) => { if (e.target.id === "modal") closeModal(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && $("#modal").classList.contains("on")) closeModal(); });
  $("#open-form").addEventListener("click", () => {
    const f = $("#form"); f.style.display = f.style.display === "none" ? "block" : "none";
  });
  $("#close-form").addEventListener("click", () => { $("#form").style.display = "none"; });

  $("#submit").addEventListener("click", async () => {
    const file = $("#f-file").files[0];
    let img = "";
    if (file) {
      if (file.size > 3 * 1024 * 1024) return toast("截图太大（上限 3MB）");
      img = await new Promise((ok) => {
        const fr = new FileReader();
        fr.onload = () => ok(String(fr.result));
        fr.readAsDataURL(file);
      });
    }
    const payload = {
      map: $("#f-map").value.trim(), agent: $("#f-agent").value.trim(),
      side: $("#f-side").value.trim(), site: $("#f-site").value.trim(),
      title: $("#f-title").value.trim(), note: $("#f-note").value.trim(),
      author: "", img,
    };
    const res = await fetch("/api/library/lineups", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      return toast(err.detail || "发布失败");
    }
    toast("已发布");
    $("#form").style.display = "none";
    load();
  });

  load();
})();
</script>
<script src="/static/statusdot.js?v=e4f8a35baa" defer></script>
</body>
</html>
